<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Фінанси</title>
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фінанси">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<div class="bg-glow"></div>

<main id="screens">
  <section id="scr-home" class="screen active"></section>
  <section id="scr-history" class="screen"></section>
  <section id="scr-analytics" class="screen"></section>
  <section id="scr-budget" class="screen"></section>
  <section id="scr-settings" class="screen"></section>
  <section id="scr-savings" class="screen"></section>
</main>

<nav class="tabbar">
  <button class="tab active" data-tab="home" onclick="go('home')">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg><span>Огляд</span>
  </button>
  <button class="tab" data-tab="history" onclick="go('history')">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Історія</span>
  </button>
  <button class="tab-add" onclick="openAdd()" aria-label="Додати витрату">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="tab-add-l">Додати</span>
  </button>
  <button class="tab" data-tab="budget" onclick="go('budget')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span>Бюджет</span>
  </button>
  <button class="tab" data-tab="analytics" onclick="go('analytics')">
    <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Аналіз</span>
  </button>
</nav>

<!-- ШВИДКЕ ДОДАВАННЯ -->
<div id="sheet-add" class="sheet full">
  <div class="sheet-box">
    <div class="sheet-h">
      <button class="icon-btn" onclick="closeAdd()" aria-label="Закрити">✕</button>
      <div class="seg seg-sm" id="aWho"></div>
      <button class="save-top" id="aSaveTop" onclick="saveAdd()">Зберегти</button>
    </div>
    <div class="sheet-scroll">
      <div class="seg seg-sm modes">
        <button id="modeOne" class="on" onclick="setAddMode('one')">Одна витрата</button>
        <button id="modeBulk" onclick="setAddMode('bulk')">Кілька одразу</button>
      </div>

      <div id="addOne">
        <label class="amount-wrap" id="aAmountWrap">
          <span class="cur">₴</span>
          <input id="aAmount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done">
        </label>
        <div id="aPicked" class="picked"></div>
        <div id="aSubs" class="chips wrap"></div>

        <div id="aQuickWrap">
          <p class="sec-t">Часто</p>
          <div id="aQuick" class="chips scroll-x"></div>
        </div>

        <p class="sec-t">Категорія</p>
        <div id="aCats" class="cat-grid"></div>

        <p class="sec-t">Коли</p>
        <div class="date-row" id="aDate"></div>

        <input id="aComment" class="inp" list="aCommList" placeholder="Коментар (не обовʼязково)" autocomplete="off" enterkeyhint="done">
        <datalist id="aCommList"></datalist>

        <button class="btn-primary big" id="aSave" onclick="saveAdd()">Зберегти</button>
      </div>

      <div id="addBulk" hidden>
        <div class="bulk-wrap"><table class="bulk-table">
          <thead><tr><th>Хто</th><th>Дата</th><th>Категорія</th><th>Підкатегорія</th><th>Сума</th><th>Коментар</th><th></th></tr></thead>
          <tbody id="bulkBody"></tbody>
        </table></div>
        <div class="row-btns"><button onclick="bulkAddRow()">+ Рядок</button></div>
        <p id="bulkTotal" class="muted center small"></p>
        <button class="btn-primary big" id="bulkSaveBtn" onclick="bulkSave()">Зберегти всі</button>
        <p class="muted center tiny">Рядки без категорії або суми пропускаються. Новий рядок бере «хто», дату й категорію з попереднього.</p>
      </div>
    </div>
  </div>
</div>

<!-- РЕДАГУВАННЯ ЗАПИСУ -->
<div id="sheet-edit" class="sheet" onclick="if(event.target===this)closeEdit()">
  <div class="sheet-box">
    <div class="sheet-h">
      <button class="icon-btn" onclick="closeEdit()" aria-label="Закрити">✕</button>
      <h3>Редагувати</h3>
      <button class="save-top" id="eSaveTop" onclick="saveEdit()">Зберегти</button>
    </div>
    <div class="sheet-scroll" id="editBody"></div>
  </div>
</div>

<!-- КАТЕГОРІЯ (налаштування) -->
<div id="sheet-cat" class="sheet" onclick="if(event.target===this)closeSheet('sheet-cat')">
  <div class="sheet-box">
    <div class="sheet-h">
      <button class="icon-btn" onclick="closeSheet('sheet-cat')" aria-label="Закрити">✕</button>
      <h3 id="catTitle">Категорія</h3>
      <span style="width:40px"></span>
    </div>
    <div class="sheet-scroll" id="catBody"></div>
  </div>
</div>

<!-- ДІАЛОГ -->
<div id="dlg" class="dlg"><div class="dlg-box" id="dlgBox"></div></div>

<div id="toast" class="toast"></div>
</body>
</html>
